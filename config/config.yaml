# ============================================================
# PFA VTEC - configuration unique du package pfa_vtec
# ============================================================

paths:
  output_dir: output
  reports_dir: reports
  figures_dir: reports/figures
  models_dir: models
  merged_csv: output/MERGED_OMNI_VTEC_30min.csv
  omni_csv: output/OMNI_30min_cleaned.csv
  vtec_csv: output/VTEC_GIM_30min_BeniMellal.csv
  storms_csv: output/storm_catalog_Bz_lt_minus10.csv

station:
  name: "Beni Mellal"
  lat: 32.34
  lon: -6.36

# Horizons de prevision en pas de 1h (resample hourly: VTEC est natif horaire)
horizons:
  - 1   # 1 h
  - 3   # 3 h
  - 6   # 6 h
  - 12  # 12 h

split:
  train_end: "2023-12-31 23:00:00"
  val_end:   "2024-12-31 23:00:00"
  embargo_steps: 24  # 24 h

features:
  lags_target:        [1, 2, 3, 6, 12, 24, 48]
  lags_drivers:       [1, 3, 6, 12]
  rolling_hours:      [3, 6, 24]
  drivers:            [Bz_mean, Vsw_mean, Pdyn_mean, Np_mean, epsilon_coupling, Bs]

forecasting:
  enabled_models: [persistence, climatology, rf, hgb, lstm]
  enable_sarima: false  # active par flag, fragile sur Windows
  rf:
    n_estimators: 300
    max_depth: 20
    min_samples_leaf: 5
  hgb:
    max_iter: 400
    max_depth: 8
    learning_rate: 0.05
  lstm:
    window: 48
    units: 48
    dropout: 0.2
    batch_size: 256
    epochs: 15
    patience: 3
    learning_rate: 0.0005

anomaly:
  enabled_methods: [iforest, ocsvm]
  contamination: 0.01
  iforest:
    n_estimators: 300
    max_samples: 2048
  ocsvm:
    nu: 0.02
    subsample: 20000
  lstm_ae:
    window: 48
    latent: 8
    units: 32
    epochs: 12
    batch_size: 256
  event_gap_hours: 6
  match_tolerance_hours: 3

theme:
  bg:     "#F6F7F8"   # oklch(98% 0.005 240)
  bg2:    "#EEF0F2"   # oklch(96% 0.008 240)
  ink:    "#16181C"   # oklch(11% 0.012 240)
  muted:  "#5F6470"   # oklch(45% 0.013 240)
  rule:   "#D7D9DD"   # oklch(88% 0.010 240)
  accent: "#E55A1F"   # oklch(72% 0.18 38)
  gray_70: "#A8ABB3"
  gray_50: "#7A7D85"
  gray_30: "#3F4248"
