[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfa_vtec"
version = "0.1.0"
description = "PFA VTEC and space weather - forecasting, anomaly detection and editorial dashboard"
authors = [{name = "Ismail LALAOUI RACHIDI"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Academic - ENSA Beni Mellal"}

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "dash>=2.16",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.15"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
pfa-vtec = "pfa_vtec.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfa_vtec*"]

[tool.ruff]
line-length = 100
target-version = "py311"
